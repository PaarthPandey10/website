name: Build and Deploy Site

on:
  # Test on pull requests
  pull_request:

  # Deploy on pushes to main
  push:
    branches:
      - main

  # Deploy when the Gemara spec publishes a release
  # (sent by the spec repo's website-dispatch workflow)
  repository_dispatch:
    types:
      - gemara-release

  # Allow manual runs, optionally against a specific spec ref
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "Gemara spec ref to build against (default: latest release)"
        required: false

# Sets permissions of the GITHUB_TOKEN to minimum required
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve spec ref
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          INPUT_REF: ${{ inputs.spec-ref }}
        run: |
          if [ -n "$DISPATCH_REF" ]; then
            ref="$DISPATCH_REF"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref="$(gh api repos/gemaraproj/gemara/releases/latest --jq .tag_name || true)"
            if [ -z "$ref" ]; then
              echo "::warning::Could not resolve latest gemara release; falling back to main"
              ref="main"
            fi
          fi
          echo "Building against gemara spec ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Test Go tools
        run: |
          cd tools
          go test -v ./...

      - name: Fetch spec OpenAPI
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.spec.outputs.ref }}
        run: |
          mkdir -p generated
          # Releases publish openapi.yaml as an asset; fall back to
          # generating it from a spec checkout for refs that predate the
          # asset (or when building against a branch like main).
          if [ "$REF" != "main" ] && gh release download "$REF" \
              --repo gemaraproj/gemara \
              --pattern openapi.yaml \
              --output generated/openapi.yaml 2>/dev/null; then
            echo "Downloaded openapi.yaml from release $REF"
          else
            echo "::warning::No openapi.yaml release asset for $REF; generating from a spec checkout"
            git clone --depth 1 --branch "$REF" https://github.com/gemaraproj/gemara .gemara-spec
            (cd .gemara-spec/cmd && go run . cue2openapi \
              --schema .. \
              --output "$GITHUB_WORKSPACE/generated/openapi.yaml")
          fi

      - name: Generate documentation
        run: make gendocs

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Test HTML
        run: make test-links

      - name: Upload artifact for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
